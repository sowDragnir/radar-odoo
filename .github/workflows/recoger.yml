name: Recoger pulsaciones

# Los botones de Telegram no tienen a nadie escuchando cuando los pulsas:
# Telegram guarda las pulsaciones en cola 24 h y esto las vacia a Notion.

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min (GitHub puede retrasarlo)
  workflow_dispatch:

concurrency:
  group: radar-db            # nunca a la vez que el radar: comparten SQLite
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar historial
        uses: actions/cache@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Volcar pulsaciones a Notion
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python -m radar.inbox
